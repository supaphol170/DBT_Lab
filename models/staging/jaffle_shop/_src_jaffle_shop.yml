sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        columns:
          - name: ID
            data_tests:
              - not_null
              - unique
      - name: orders
        columns:
          - name: ID
            data_tests:
              - not_null
              - unique
          - name: ID
            data_tests:
              - relationships:
                  field: ID
                  to: ref('customers')
